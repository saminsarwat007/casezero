    (() => {

      const tl = gsap.timeline({ paused: true });
      window.__timelines = window.__timelines || {};
      window.__timelines[id] = tl;

      const prefixEl = document.getElementById("f01-complaint-vanishes-prefix");
      const activeEl = document.getElementById("f01-complaint-vanishes-active");
      const cursorEl = document.getElementById("f01-complaint-vanishes-cursor");

      const sequence = [
        { t: 0.00, prefix: "", active: "", color: "#e4eae5" },
        { t: 0.18, prefix: "", active: "A", color: "#e4eae5" },
        { t: 0.34, prefix: "", active: "A complaint", color: "#e4eae5" },
        { t: 0.72, prefix: "", active: "A complaint can", color: "#e4eae5" },
        { t: 1.08, prefix: "", active: "A complaint can feel", color: "#e4eae5" },
        { t: 1.54, prefix: "", active: "A complaint can feel like", color: "#e4eae5" },
        { t: 2.04, prefix: "", active: "A complaint can feel like it", color: "#e4eae5" },
        { t: 2.80, prefix: "", active: "A complaint can feel like i", color: "#a8bfb0" },
        { t: 2.96, prefix: "", active: "A complaint can feel like ", color: "#a8bfb0" },
        { t: 3.18, prefix: "A complaint can feel like ", active: "d", color: "#8b2333" },
        { t: 3.34, prefix: "A complaint can feel like ", active: "dis", color: "#8b2333" },

        { t: 4.18, prefix: "A complaint can feel like ", active: "disappears.", color: "#8b2333" }
      ];

      const entryAt = (time) => {
        for (let index = sequence.length - 1; index >= 0; index -= 1) {
          if (time >= sequence[index].t) return sequence[index];
        }
        return sequence[0];
      };

      const changeTimes = sequence.slice(1).map((entry) => entry.t);
      const driver = { t: 0 };
      const blink = { p: 0 };

      tl.to(driver, {
        t: 5.8,
        duration: 5.8,
        ease: "none",
        onUpdate: () => {
          const entry = entryAt(driver.t);
          prefixEl.textContent = entry.prefix;
          activeEl.textContent = entry.active;
          activeEl.style.color = entry.color;
          cursorEl.style.background = entry.color;
          const isTyping = changeTimes.some((time) => time <= driver.t && driver.t - time < 0.15);
          cursorEl.style.opacity = isTyping || Math.sin(blink.p) > 0 ? "1" : "0";
        }
      }, 0);

      tl.to(blink, {
        p: Math.PI * 2 * 8,
        duration: 5.8,

      }, 0);
