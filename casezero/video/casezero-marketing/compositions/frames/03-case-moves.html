  <div id="root"

    <!-- approved frame video hoisted by assemble-index -->

    <!-- No synthetic topbar or live-mark: the real Boardroom film carries its own
         kicker, headline, and elapsed counter; overlay chrome collided with them. -->

      data-start="4.58"

      <div class="frame-03-case-moves-receipt-rule"></div>
      <div class="frame-03-case-moves-receipt-label" id="f03-case-moves-receipt-label">
        <span class="frame-03-case-moves-receipt-text" id="f03-case-moves-receipt-text"></span>
      </div>
    </div>

  </div>

  <script>
    (() => {
      const tl = gsap.timeline({ paused: true });
      window.__timelines = window.__timelines || {};
      window.__timelines["03-case-moves"] = tl;

      const receiptText = document.getElementById("f03-case-moves-receipt-text");
      const receiptLabel = document.getElementById("f03-case-moves-receipt-label");

      // Receipts land exactly when the narration names them:
      // "Records" 4.58 · "deadline" 6.10 · "next step" 8.04 (local seconds).
      const RECEIPT_START = 4.58;
      const RECEIPT_TIMELINE = [
        { title: "Records are checked.", start: 0 },
        { title: "Deadline watched.", start: 6.10 - RECEIPT_START },
        { title: "Next step ready.", start: 8.04 - RECEIPT_START }
      ];
      const RECEIPT_SPAN = 10.344 - RECEIPT_START;

      function entryAt(time) {
        for (let i = RECEIPT_TIMELINE.length - 1; i >= 0; i -= 1) {
          if (time >= RECEIPT_TIMELINE[i].start) return RECEIPT_TIMELINE[i];
        }
        return RECEIPT_TIMELINE[0];
      }

      const receiptDriver = { t: 0 };
      let lastTitle = "";
      tl.to(receiptDriver, {
        t: RECEIPT_SPAN,
        duration: RECEIPT_SPAN,
        ease: "none",
        onUpdate: () => {
          const entry = entryAt(receiptDriver.t);
          if (entry.title !== lastTitle) {
            receiptText.textContent = entry.title;
            lastTitle = entry.title;
          }
        }
      }, RECEIPT_START);

      tl.fromTo(receiptLabel,
        { opacity: 0, x: -58 },
        { opacity: 1, x: 0, duration: 1.25, ease: "expo.out" },
        4.58
      );

      tl.fromTo(".frame-03-case-moves-receipt-kicker",
        { opacity: 0, x: -24 },
        { opacity: 1, x: 0, duration: 1.0, ease: "expo.out" },
        4.76
      );

      tl.fromTo(".frame-03-case-moves-receipt-rule",
        { scaleX: 0, transformOrigin: "0% 50%" },
        { scaleX: 1, duration: 1.05, ease: "expo.out" },
        4.66
      );

      tl.to(receiptLabel, {
        backgroundColor: "#8B2333",
        borderColor: "#8B2333",
        color: "#E4EAE5",
        duration: 0.62,
        ease: "power3.out"
      }, 8.04);

      tl.to(".frame-03-case-moves-receipt-rule", {
        backgroundColor: "#8B2333",
        duration: 0.62,
        ease: "power3.out"
      }, 8.04);
    })();
  </script>
